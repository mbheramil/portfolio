<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Loading… — mbheramil</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/main.css">
<script>
  (function(){ var t = localStorage.getItem('theme'); if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; if (t === 'dark') document.documentElement.setAttribute('data-theme','dark'); })();
</script>
</head>
<body>
<div class="scroll-progress" id="scrollProgress"></div>

<header class="nav" id="nav">
  <div class="container nav__inner">
    <a href="/" class="nav__logo">mbheramil</a>
    <nav class="nav__links">
      <a href="/">Home</a>
      <a href="blog.html">Blog</a>
      <a href="/#contact">Contact</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<article class="post-article container" id="postArticle">
  <div style="text-align:center;color:var(--muted);padding:40px">Loading…</div>
</article>

<script>
const API = 'https://admin.mbheramil.com';
const slug = new URLSearchParams(location.search).get('p');
(async function(){
  const el = document.getElementById('postArticle');
  if (!slug) { el.innerHTML = '<p>No post specified. <a href="blog.html">Back to blog</a></p>'; return; }
  try {
    const res = await fetch(API + '/api/posts/' + encodeURIComponent(slug));
    if (!res.ok) throw new Error('not found');
    const p = await res.json();
    document.title = p.title + ' — mbheramil';
    const m = document.querySelector('meta[name="description"]');
    if (m && p.excerpt) m.setAttribute('content', p.excerpt);
    const date = new Date((p.publish_at || p.created_at) * 1000).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
    el.innerHTML = `
      <div style="margin-bottom:24px"><a href="blog.html" style="color:var(--muted);font-size:.9rem">← Back to blog</a></div>
      ${p.cover ? `<img src="${p.cover}" style="width:100%;border-radius:12px;margin-bottom:24px" alt="">` : ''}
      <h1>${escapeHtml(p.title)}</h1>
      <div class="meta">${date}${(p.tags||[]).length ? ' · ' + p.tags.map(t => `<span style="background:var(--bg-alt);padding:2px 8px;border-radius:4px;font-size:.8rem;margin-right:4px">${escapeHtml(t)}</span>`).join('') : ''}</div>
      <div class="body">${p.body_html}</div>
      <hr style="margin:48px 0 24px;border:none;border-top:1px solid var(--border)">
      <p style="color:var(--muted)">Want to discuss something like this? <a href="/#contact" style="color:var(--accent)">Get in touch →</a></p>
    `;
  } catch (e) {
    el.innerHTML = '<h1>Post not found</h1><p><a href="blog.html">Back to blog</a></p>';
  }
})();
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('themeToggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark';
  if (cur) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme','light'); }
  else { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('theme','dark'); }
});
const bar = document.getElementById('scrollProgress');
addEventListener('scroll', () => {
  const h = document.documentElement; const max = h.scrollHeight - h.clientHeight;
  bar.style.width = max > 0 ? ((h.scrollTop/max)*100)+'%' : '0%';
}, { passive: true });
addEventListener('scroll', () => document.getElementById('nav').classList.toggle('scrolled', scrollY > 8), { passive: true });
</script>
</body>
</html>
