<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Blog — mbheramil</title>
<meta name="description" content="Notes on building fast, beautiful, accessible websites.">
<link rel="alternate" type="application/rss+xml" title="RSS" href="https://admin.mbheramil.com/rss.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/main.css">
<script>
  (function(){ var t = localStorage.getItem('theme'); if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; if (t === 'dark') document.documentElement.setAttribute('data-theme','dark'); })();
</script>
</head>
<body>
<div class="scroll-progress" id="scrollProgress"></div>

<header class="nav" id="nav">
  <div class="container nav__inner">
    <a href="/" class="nav__logo">mbheramil</a>
    <nav class="nav__links">
      <a href="/">Home</a>
      <a href="/#services">Services</a>
      <a href="/#work">Work</a>
      <a href="blog.html">Blog</a>
      <a href="/#contact">Contact</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" hidden style="display:none"></button>
  </div>
</header>

<section class="section" style="padding-top:140px">
  <div class="container">
    <div class="section__head">
      <span class="section__label">Blog</span>
      <h2 class="section__title">Recent posts</h2>
    </div>
    <div class="blog-list" id="blogList"><div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">Loading…</div></div>
  </div>
</section>

<script>
const API = 'https://admin.mbheramil.com';
(async function(){
  const list = document.getElementById('blogList');
  try {
    const res = await fetch(API + '/api/posts');
    const posts = await res.json();
    list.innerHTML = '';
    if (!posts.length) { list.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted)">No posts yet.</div>'; return; }
    for (const p of posts) {
      const card = document.createElement('a');
      card.className = 'post-card';
      card.href = 'blog-post.html?p=' + encodeURIComponent(p.slug);
      const cover = p.cover ? `<div class="post-card__cover" style="background-image:url(${p.cover})"></div>` : `<div class="post-card__cover"></div>`;
      const date = new Date((p.publish_at || p.created_at) * 1000).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
      card.innerHTML = cover + `<div class="post-card__body">
        <div class="post-card__date">${date}</div>
        <div class="post-card__title">${escapeHtml(p.title)}</div>
        <div class="post-card__excerpt">${escapeHtml(p.excerpt || '')}</div>
      </div>`;
      list.appendChild(card);
    }
  } catch (e) {
    list.innerHTML = '<div style="grid-column:1/-1;color:#dc2626">Failed to load posts.</div>';
  }
})();
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('themeToggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark';
  if (cur) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme','light'); }
  else { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('theme','dark'); }
});
const bar = document.getElementById('scrollProgress');
addEventListener('scroll', () => {
  const h = document.documentElement; const max = h.scrollHeight - h.clientHeight;
  bar.style.width = max > 0 ? ((h.scrollTop/max)*100)+'%' : '0%';
}, { passive: true });
addEventListener('scroll', () => document.getElementById('nav').classList.toggle('scrolled', scrollY > 8), { passive: true });
</script>
</body>
</html>
